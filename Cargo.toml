[package]
name = "tomatui"
version = "0.1.0"
edition = "2021"
description = "A clean, offline-first Pomodoro TUI and agent-friendly CLI backed by SQLite."
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rodio = { version = "0.19", default-features = false, features = ["wav"] }
notify-rust = "4.11"
directories = "6.0"

[lints.rust]
unsafe_code = "forbid"
